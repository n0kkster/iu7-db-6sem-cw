services:
  neo4j_db:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_LOGIN}/${NEO4J_PASSWORD}

      - NEO4J_PLUGINS=["apoc"] 
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - ./.neo4j/data:/data
      - ./.neo4j/logs:/logs
    restart: unless-stopped