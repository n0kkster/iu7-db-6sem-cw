services:
  neo4j_db:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_LOGIN}/${NEO4J_PASSWORD}

      - NEO4J_PLUGINS=["apoc"] 
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - ./.neo4j/data:/data
      - ./.neo4j/logs:/logs
    restart: no
  postgres:
    image: postgres:17
    container_name: postgres-cw
    environment:
      - POSTGRES_USER=${POSTGRES_LOGIN}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.postgres/data:/data
    restart: no

volumes:
  postgres-data:
    name: postgres-cw-data